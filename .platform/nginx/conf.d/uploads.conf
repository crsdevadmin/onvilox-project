# Dictation posts the recording as base64 inside a JSON body. nginx's default
# client_max_body_size is 1 MB, which a longer recording exceeds — and a rejected
# body is answered by nginx itself with an HTML error page, so the browser gets
# "Unexpected token '<'" instead of anything useful. Transcription can also take
# longer than the default proxy timeout on a slow link.
client_max_body_size 25M;
proxy_read_timeout   120s;
proxy_send_timeout   120s;
